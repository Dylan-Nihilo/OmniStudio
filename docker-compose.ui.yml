name: omnistudio-ui

services:
  backend:
    image: ${UI_BACKEND_IMAGE:?UI_BACKEND_IMAGE is required}
    env_file:
      - .env
      - .ui.env
    volumes:
      - ./output:/app/output
      # The app reloads dotenv with override=True; retain the isolated auth settings.
      - ./.ui.env:/app/.env:ro
      - ./runtime-config:/root/.omni-studio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:17177/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${UI_FRONTEND_IMAGE:?UI_FRONTEND_IMAGE is required}
    ports:
      - "${UI_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
