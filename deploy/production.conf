# Public address of the hosted Studio — the one place the production domain is set.
#   * the frontend image redirects every other host (e.g. the raw :3000 port) here;
#   * the backend always accepts its origin for cookie auth, whatever the host .env says;
#   * scripts/deploy_public_site.sh renders the gateway for this host and checks it after
#     every production deploy, so neither a redeploy nor a hand edit can drift it.
# The application lives under /app/ because the landing page (deploy/website) owns /.
OMNI_STUDIO_PUBLIC_URL=https://studio.omnisline.com/app/
