family: minimax
display_name: MiniMax
provider: jojokey
routing_prefixes:
  - minimax/minimax-
  - minimax-
supported_backends:
  - jojokey
default_backend: jojokey
credential_sources:
  jojokey:
    - JOJOKEY_API_KEY
supported_modalities:
  - t2v
  - i2v
  - r2v
  - v2v
transport:
  image_input_mode:
    jojokey: jojokey_content_image_url
  audio_input_mode:
    jojokey: jojokey_content_audio_url
  reference_video_input_mode:
    jojokey: jojokey_content_video_url
docs:
  official_snapshot_ids:
    - jojokey/minimax-a/2026-09-14
models:
  - id: minimax/minimax-h3
    model_line_id: minimax/minimax-h3
    display_name: MiniMax A Video
    description: MiniMax A text, keyframe and multimodal reference video via the JojoKey relay
    status: active
    release_stage: preview
    capabilities: [i2v, r2v, t2v, v2v]
    runtime:
      jojokey:
        gateway: jojokey
        # MiniMax is not on JojoKey's CN line, so this one family settles in USD.
        #
        # minimax-A rather than the H3 workflow: H3 lives on its own multipart endpoint and
        # explicitly cannot lock a first frame, which is exactly what our i2v slot means.
        # minimax-A sits on the same /v1/videos endpoint, does keyframe and reference modes,
        # and is cheaper at every tier. It takes its own flat payload shape, hence `dialect`.
        line: overseas
        overseas_model: minimax-A
        dialect: minimax_a
    docs:
      context_hub_doc_ids:
        - jojokey/minimax-a-api
    ui:
      selection_group: i2v
      visible_in: [project_settings, series_settings, video_sidebar, global_settings]
      order: 100
      badges: [new]
    duration:
      type: slider
      min: 4
      max: 12
      step: 1
      default: 5
    params:
      resolution:
        # minimax-A's own size names, passed through verbatim as both the price match key
        # and the upstream value.
        options: [720P, 960P, 2K]
        default: 720P
      ratio:
        options: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
        default: "16:9"
      negativePrompt: false
      promptExtend: false
      watermark: false
    inputs:
      reference_images:
        max: 1
        reference_type: image
