# Full-stack validation gate for merging into main and deploying production.
#
# Runs the backend and frontend checks on every pull request targeting main
# and on pushes to main. A successful push run unlocks the production deploy.
#
# To make this a hard gate, require both "backend-tests" and
# "frontend-tests" in the main branch protection rules.

name: Backend CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install dependencies
        # requirements-docker.txt is the headless subset of requirements.txt
        # (no pywebview / demucs); the test suite only needs these.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt pytest

      - name: Prepare output directories
        run: mkdir -p output/{assets,audio,export,storyboard,uploads,video,video_inputs,projects,series,omni_studio}

      - name: Run Python test suite
        run: python -m pytest

      - name: Validate model catalog
        run: python scripts/validate_model_catalog.py

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:all

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build
        env:
          DOCKER_BUILD: "true"
