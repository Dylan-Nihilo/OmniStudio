server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes (SPA fallback)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Keep the exported frontend same-origin with every FastAPI surface.
    # Hash routes stay in the static fallback above, while API paths are
    # forwarded without exposing the backend container publicly.
    # A missing prefix does not 404 here — it falls through to index.html and the
    # frontend receives HTML where it expects JSON, so tests/test_nginx_api_allowlist.py
    # asserts this list covers every backend route.
    location ~ ^/(auth|billing|admin|projects|series|library|playground|files|tasks|art_direction|upload|video|voice|voices|config|system|diagnose|debug|director-plans|purge-jobs|prompt_defaults|bgm|health|docs|openapi\.json)(/|$) {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 500M;
    }
}
